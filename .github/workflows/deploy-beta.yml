name: deploy-beta

# Depois que "tests" passa em main: sincroniza a branch beta e dispara o deploy no Coolify.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sincroniza beta com main
        run: git push origin HEAD:refs/heads/beta

      - name: Deploy no Coolify (app, worker, scheduler)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"uuid":"ipbknnticmaubtzdonxjqgy6,jme7xgh4ugrrf3qbrxaclwlj,3thwz32zdtnmr2sme70jrpdf"}'
