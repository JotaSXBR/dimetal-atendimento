name: base-image

# Constrói a imagem base do PHP (extensões compiladas) e publica no GHCR. Roda quando o Dockerfile da base muda, uma vez
# por semana (correções do sistema) e sob demanda. No PR só constrói, para provar que compila.
on:
  push:
    branches:
      - main
    paths:
      - 'docker/base/**'
      - '.github/workflows/base-image.yml'
  pull_request:
    paths:
      - 'docker/base/**'
      - '.github/workflows/base-image.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag segue a versão do PHP do próprio Dockerfile da base: quando o Dependabot sobe o serversideup/php, a imagem sai
      # como :8.6 em vez de reaproveitar o rótulo :8.5.
      - name: Read PHP version
        id: versions
        uses: ./.github/actions/versions

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/base
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/jotasxbr/dimetal-php-base:${{ steps.versions.outputs.php }}
            ghcr.io/jotasxbr/dimetal-php-base:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
