name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A main exige PR atualizado (strict), então o push na main traz a mesma árvore que o PR já testou. Em tests e static, o
  # passo already-tested consulta se essa árvore passou num run verde deste workflow, num PR do próprio repositório; se
  # passou, os passos seguintes não repetem o trabalho. A consulta fica dentro do job (e não num job próprio) para que
  # uma falha ou um runner que não sai da fila nunca deixe o run vermelho e trave o release-image: qualquer erro deixa
  # tested=false e tudo roda. O audit roda sempre: aviso novo depende do dia, não da árvore.
  tests:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fluxie_test
          POSTGRES_USER: fluxie
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxie -d fluxie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: fluxie_test
      DB_USERNAME: fluxie
      DB_PASSWORD: secret
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      APP_ENV: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether this tree already passed in a PR
        id: tested
        if: github.event_name == 'push'
        continue-on-error: true
        uses: ./.github/actions/already-tested
        with:
          token: ${{ github.token }}

      - name: Read PHP and Node versions
        if: steps.tested.outputs.tested != 'true'
        id: versions
        uses: ./.github/actions/versions

      - name: Setup PHP
        if: steps.tested.outputs.tested != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ steps.versions.outputs.php }}
          extensions: pdo_pgsql, pgsql, mbstring, intl, zip, gd
          tools: composer:v2
          coverage: pcov

      - name: Cache Composer packages
        if: steps.tested.outputs.tested != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Setup Node
        if: steps.tested.outputs.tested != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm

      - name: Setup Application
        if: steps.tested.outputs.tested != 'true'
        run: composer setup

      - name: Run JS tests
        if: steps.tested.outputs.tested != 'true'
        run: node --test tests/js

      - name: Run tests with coverage
        if: steps.tested.outputs.tested != 'true'
        run: composer ci:tests

      # Registro para o push da main (passo already-tested). Só vale se o run inteiro terminar verde, o que o lookup confere.
      - name: Record tested tree
        if: github.event_name == 'pull_request'
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/tested-tree"

      - name: Upload tested tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree
          retention-days: 14
          overwrite: true

  # Pint, Larastan e PHPMD não precisam de banco: rodam em paralelo com os testes, e o PR espera só o job mais lento.
  static:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether this tree already passed in a PR
        id: tested
        if: github.event_name == 'push'
        continue-on-error: true
        uses: ./.github/actions/already-tested
        with:
          token: ${{ github.token }}

      - name: Read PHP and Node versions
        if: steps.tested.outputs.tested != 'true'
        id: versions
        uses: ./.github/actions/versions

      - name: Setup PHP
        if: steps.tested.outputs.tested != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ steps.versions.outputs.php }}
          extensions: mbstring, intl, zip, gd
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        if: steps.tested.outputs.tested != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # O cache só acelera: com ele frio o veredito é o mesmo (o Larastan reanalisa tudo).
      - name: Cache Larastan and Pint
        if: steps.tested.outputs.tested != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .phpstan.cache
            .pint.cache
          key: static-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon') }}-${{ github.sha }}
          restore-keys: |
            static-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon') }}-
            static-${{ runner.os }}-

      - name: Install dependencies
        if: steps.tested.outputs.tested != 'true'
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      # O Dependabot atualiza as imagens do compose.yaml, mas não as de `services:` deste arquivo. Sem esta conferência o CI
      # testaria numa versão de Postgres/Redis diferente da do desenvolvimento.
      - name: Check CI service images match compose.yaml
        if: steps.tested.outputs.tested != 'true'
        run: |
          for name in postgres redis; do
            image=$(sed -nE "s/^ *image: (${name}:[^ ]+).*/\1/p" compose.yaml | head -1)
            [ -n "$image" ] || { echo "compose.yaml sem imagem $name" >&2; exit 1; }
            grep -qE "^ *image: ${image}\$" .github/workflows/tests.yml || { echo "tests.yml deve usar ${image} (igual ao compose.yaml)" >&2; exit 1; }
          done

      - name: Run static checks
        if: steps.tested.outputs.tested != 'true'
        run: composer ci:static
  # Separado dos testes: um aviso de segurança novo não deve reprovar um PR que não tem relação com ele.
  audit:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read PHP and Node versions
        id: versions
        uses: ./.github/actions/versions

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ steps.versions.outputs.php }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      # Os dois audits leem só os lockfiles (--locked e --package-lock-only): instalar não muda o veredito.
      - name: Audit dependencies
        run: composer security:audit
