# Proxy do WebSocket do Reverb: o navegador fala com o mesmo domínio do app e o nginx repassa /app e /apps ao serviço `reverb`
# do compose. Resolver do Docker + variável no proxy_pass: o nginx sobe mesmo se o Reverb ainda não existe.
resolver 127.0.0.11 valid=30s ipv6=off;

location ~ ^/apps?(/|$) {
    set $reverb http://reverb:8080;
    proxy_pass $reverb;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}
