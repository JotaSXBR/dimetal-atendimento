# Cabeçalhos de segurança para os arquivos estáticos (assets e fontes).
#
# A imagem base define estes cabeçalhos no nível do `server` (`server-opts.d/security.conf`), mas o `performance.conf`
# dela declara `add_header` dentro dos locations de assets e fontes, e o nginx não herda os cabeçalhos do `server` num
# location que declara os próprios. Resultado: CSS, JS e fontes saíam sem `nosniff` e sem HSTS. O Dockerfile inclui este
# arquivo nesses locations.
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
