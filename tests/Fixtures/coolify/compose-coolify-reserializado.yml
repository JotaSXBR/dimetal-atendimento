      WAHA_API_KEY: '${SERVICE_PASSWORD_WAHA}'
      WAHA_WEBHOOK_URL: 'http://app:8080/webhooks/waha'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:-}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET:-}'
      GOOGLE_REDIRECT_URI: '${SERVICE_URL_APP}/configuracoes/google/callback'
      AUTORUN_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - '-r'
        - "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  waha:
    image: 'devlikeapro/waha:gows-2026.10.1'
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      TZ: America/Sao_Paulo
      WAHA_API_KEY: '${SERVICE_PASSWORD_WAHA}'
      WAHA_DASHBOARD_ENABLED: 'false'
      WHATSAPP_SWAGGER_ENABLED: 'false'
      WAHA_WORKER_RESTART_SESSIONS: 'true'
      WAHA_PRESENCE_AUTO_ONLINE: 'false'
      WAHA_PRESENCE_AUTO_ONLINE_DURATION_SECONDS: '0'
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: '0'
      WAHA_EVENTS_DOWNLOAD_MEDIA: 'true'
      GODEBUG: netdns=go
      WAHA_GOWS_DEVICE_REQUIRE_FULL_SYNC: 'false'
      WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_DAYS_LIMIT: '10'
      WAHA_GOWS_DEVICE_HISTORY_SYNC_RECENT_SYNC_DAYS_LIMIT: '7'
      WAHA_GOWS_DEVICE_HISTORY_SYNC_INITIAL_SYNC_MAX_MESSAGES_PER_CHAT: '200'
      WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_SIZE_MB_LIMIT: '256'
      WAHA_GOWS_DEVICE_HISTORY_SYNC_STORAGE_QUOTA_MB: '512'
    volumes:
      - 'waha-sessions:/app/.sessions'
      - 'waha-media:/app/.media'
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - 'http://localhost:3000/ping'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  postgres:
    image: 'postgres:18-alpine'
    environment:
      POSTGRES_DB: fluxie
      POSTGRES_USER: fluxie
      POSTGRES_PASSWORD: '${SERVICE_PASSWORD_POSTGRES}'
    volumes:
      - 'pg-data:/var/lib/postgresql'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U fluxie -d fluxie'
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: 'redis:8-alpine'
    command:
      - sh
      - '-c'
      - 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: '${SERVICE_PASSWORD_REDIS}'
      REDISCLI_AUTH: '${SERVICE_PASSWORD_REDIS}'
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
  rustfs:
    image: 'rustfs/rustfs:1.0.6'
    environment:
      RUSTFS_ACCESS_KEY: '${SERVICE_USER_RUSTFS}'
      RUSTFS_SECRET_KEY: '${SERVICE_PASSWORD_RUSTFS}'
    volumes:
      - 'rustfs-data:/data'
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - 'http://localhost:9000/health'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  app-storage: null
  waha-sessions: null
  waha-media: null
  pg-data: null
  redis-data: null
  rustfs-data: null
