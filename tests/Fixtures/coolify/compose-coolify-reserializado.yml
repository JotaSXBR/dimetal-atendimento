    image: 'ghcr.io/fluxie-tech/fluxie-inbox:${FLUXIE_VERSION:-0.0.0-teste.1}'
    command:
      - php
      - artisan
      - 'schedule:work'
    environment:
      APP_NAME: 'Fluxie Inbox'
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: 'base64:${SERVICE_REALBASE64_32_APPKEY}'
      APP_URL: '${SERVICE_URL_APP}'
