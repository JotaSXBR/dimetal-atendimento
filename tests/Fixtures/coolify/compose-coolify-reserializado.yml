      GOOGLE_REDIRECT_URI: '${SERVICE_URL_APP}/configuracoes/google/callback'
      AUTORUN_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - healthcheck-schedule
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  reverb:
    image: 'ghcr.io/fluxie-tech/fluxie-inbox:${FLUXIE_VERSION:-0.0.0-teste.1}'
    command:
      - php
      - artisan
      - 'reverb:start'
      - '--host=0.0.0.0'
      - '--port=8080'
    environment:
      APP_NAME: 'Fluxie Inbox'
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: 'base64:${SERVICE_REALBASE64_32_APPKEY}'
      APP_URL: '${SERVICE_URL_APP}'
