      AWS_ENDPOINT: 'http://rustfs:9000'
      AWS_USE_PATH_STYLE_ENDPOINT: 'true'
      AWS_ACCESS_KEY_ID: '${SERVICE_USER_RUSTFS}'
      AWS_SECRET_ACCESS_KEY: '${SERVICE_PASSWORD_RUSTFS}'
      WAHA_URL: 'http://waha:3000'
