# Compose de produção usado pelo Coolify. Main e beta rodam este mesmo arquivo;
# o que muda é o env do projeto (domínio, APP_KEY, senhas) e o chip do WhatsApp.
#
# Nada aqui publica porta no host: só o `app` recebe domínio, via SERVICE_FQDN_APP_8080.
name: dimetal

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: dimetal-app:latest
  restart: unless-stopped
  stop_signal: SIGTERM
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-app-env: &app-env
  APP_NAME: Dimetal Distribuidora
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL}
  APP_TIMEZONE: America/Sao_Paulo
  APP_LOCALE: pt_BR
  APP_MAINTENANCE_DRIVER: file
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-dimetal}
  DB_USERNAME: ${DB_USERNAME:-dimetal}
  DB_PASSWORD: ${DB_PASSWORD}
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "120"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:
  app:
    <<: *app-base
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "true"
      # Coolify gera o domínio a partir desta chave e roteia para a porta 8080 do container.
      SERVICE_FQDN_APP_8080: ${SERVICE_FQDN_APP_8080}
    expose:
      - "8080"
    volumes:
      - app-storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *app-base
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=120", "--max-time=3600"]
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
    volumes:
      - app-storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app-base
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "false"
    volumes:
      - app-storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dimetal}
      POSTGRES_USER: ${DB_USERNAME:-dimetal}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      # Postgres 18 usa /var/lib/postgresql como raiz do volume, não .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dimetal} -d ${DB_DATABASE:-dimetal}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  waha:
    image: devlikeapro/waha:gows-2026.9.2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      TZ: America/Sao_Paulo
      WAHA_WORKER_ID: ${WAHA_WORKER_ID:-waha}
      WAHA_WORKER_RESTART_SESSIONS: "true"
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_PRESENCE_AUTO_ONLINE: "False"
      WAHA_PRESENCE_AUTO_ONLINE_DURATION_SECONDS: "0"
      WHATSAPP_HOOK_URL: http://app/webhooks/waha
      WHATSAPP_HOOK_EVENTS: session.status,message,message.any,message.ack,message.reaction,message.revoked,presence.update
      WHATSAPP_HOOK_HMAC_KEY: ${WHATSAPP_HOOK_HMAC_KEY}
      WHATSAPP_HOOK_RETRIES_POLICY: exponential
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "3"
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "8"
      WAHA_EVENTS_DOWNLOAD_MEDIA: "true"
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: "0"
      GODEBUG: netdns=go
      WAHA_GOWS_DEVICE_REQUIRE_FULL_SYNC: "false"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_DAYS_LIMIT: "10"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_RECENT_SYNC_DAYS_LIMIT: "7"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_INITIAL_SYNC_MAX_MESSAGES_PER_CHAT: "200"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_SIZE_MB_LIMIT: "256"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_STORAGE_QUOTA_MB: "512"
    volumes:
      - waha-sessions:/app/.sessions
      - waha-media:/app/.media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  waha-sessions:
  waha-media:
  app-storage:
