services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dimetal
      POSTGRES_USER: dimetal
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
